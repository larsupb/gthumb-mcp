[project]
name = "gthumb-mcp"
version = "0.1.0"
description = "MCP server for the gThumb image library: catalogs, tags, ratings, comments, thumbnails and search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "gthumb", "image", "metadata", "exiftool", "thumbnails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=1.2.0",
    "pillow>=11.3",
]

[project.urls]
Homepage = "https://github.com/larsupb/gthumb-mcp"
Repository = "https://github.com/larsupb/gthumb-mcp"
Issues = "https://github.com/larsupb/gthumb-mcp/issues"

[project.scripts]
gthumb-mcp = "gthumb_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gthumb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
